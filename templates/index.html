<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Email Detection Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .input-section {
            display: flex;
            flex-direction: column;
        }
        
        .input-section label {
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s ease;
        }
        
        button:hover {
            transform: scale(1.02);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-box .value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result.phishing {
            background: #ffe0e0;
            border: 2px solid #ff6b6b;
        }
        
        .result.safe {
            background: #e0ffe0;
            border: 2px solid #51cf66;
        }
        
        .result h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .result.phishing h3 {
            color: #c92a2a;
        }
        
        .result.safe h3 {
            color: #2b8a3e;
        }
        
        .model-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        
        .model-result {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .model-result .model-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }
        
        .probability-bars {
            margin-top: 10px;
        }
        
        .probability-bar {
            margin-bottom: 8px;
        }
        
        .probability-bar label {
            font-size: 0.9em;
            display: block;
            margin-bottom: 4px;
        }
        
        .bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 5px;
            color: white;
            font-size: 0.75em;
            font-weight: 600;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .metric {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .metric-label {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }
        
        .metric-value {
            font-size: 1.3em;
            color: #667eea;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .confusion-chart {
            text-align: center;
            margin-top: 20px;
        }
        
        .confusion-chart img {
            max-width: 100%;
            border-radius: 8px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .model-results {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Phishing Email Detector</h1>
            <p>Machine Learning Model using Scikit-learn</p>
        </header>
        
        <div class="main-content">
            <div class="card">
                <h2>📧 Analyze Email</h2>
                <div class="input-section">
                    <label for="emailInput">Enter Email Text:</label>
                    <textarea id="emailInput" placeholder="Paste your email here..."></textarea>
                    <button onclick="analyzeEmail()">Analyze Email</button>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Analyzing...</p>
                    </div>
                </div>
                
                <div class="result" id="result">
                    <h3 id="predictionTitle"></h3>
                    <div class="model-results" id="modelResults"></div>
                </div>
            </div>
            
            <div class="card">
                <h2>📊 Model Statistics</h2>
                <div class="stats" id="stats">
                    <div class="stat-box">
                        <div class="label">Naive Bayes Accuracy</div>
                        <div class="value" id="nbAccuracy">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="label">Random Forest Accuracy</div>
                        <div class="value" id="rfAccuracy">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="label">Training Samples</div>
                        <div class="value" id="trainingSamples">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="label">Test Samples</div>
                        <div class="value" id="testSamples">--</div>
                    </div>
                </div>
                
                <h3 style="color: #667eea; margin-top: 20px; margin-bottom: 15px;">Model Metrics</h3>
                <div class="metrics-grid" id="metricsGrid"></div>
            </div>
        </div>
        
        <div class="card full-width">
            <h2>🎯 Confusion Matrices</h2>
            <div class="confusion-chart" id="confusionChart">
                <p>Loading visualization...</p>
            </div>
        </div>
    </div>
    
    <script>
        let statsLoaded = false;
        
        function loadStats() {
            if (statsLoaded) return;
            
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('nbAccuracy').textContent = data.nb_accuracy;
                    document.getElementById('rfAccuracy').textContent = data.rf_accuracy;
                    document.getElementById('trainingSamples').textContent = data.training_samples;
                    document.getElementById('testSamples').textContent = data.test_samples;
                    statsLoaded = true;
                })
                .catch(error => console.error('Error loading stats:', error));
            
            fetch('/metrics')
                .then(response => response.json())
                .then(data => {
                    const metricsHtml = `
                        <div class="metric">
                            <div class="metric-label">Naive Bayes - Safe Precision</div>
                            <div class="metric-value">${(data.nb_report['Safe'].precision * 100).toFixed(2)}%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Naive Bayes - Phishing Precision</div>
                            <div class="metric-value">${(data.nb_report['Phishing'].precision * 100).toFixed(2)}%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Random Forest - Safe Precision</div>
                            <div class="metric-value">${(data.rf_report['Safe'].precision * 100).toFixed(2)}%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Random Forest - Phishing Precision</div>
                            <div class="metric-value">${(data.rf_report['Phishing'].precision * 100).toFixed(2)}%</div>
                        </div>
                    `;
                    document.getElementById('metricsGrid').innerHTML = metricsHtml;
                })
                .catch(error => console.error('Error loading metrics:', error));
            
            fetch('/confusion-matrix')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('confusionChart').innerHTML = `<img src="${data.chart}" alt="Confusion Matrix">`;
                })
                .catch(error => console.error('Error loading confusion matrix:', error));
        }
        
        function analyzeEmail() {
            const email = document.getElementById('emailInput').value.trim();
            
            if (!email) {
                alert('Please enter an email to analyze');
                return;
            }
            
            loadStats();
            
            document.getElementById('loading').classList.add('show');
            
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').classList.remove('show');
                displayResult(data);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('loading').classList.remove('show');
                alert('Error analyzing email');
            });
        }
        
        function displayResult(data) {
            const result = document.getElementById('result');
            const predictionTitle = document.getElementById('predictionTitle');
            
            const nbPhishing = data.nb_phishing_prob > 0.5;
            const rfPhishing = data.rf_phishing_prob > 0.5;
            const isPhishing = nbPhishing || rfPhishing;
            
            result.className = 'result show ' + (isPhishing ? 'phishing' : 'safe');
            
            predictionTitle.textContent = isPhishing ? '⚠️ PHISHING DETECTED' : '✅ EMAIL IS SAFE';
            
            const modelResultsHtml = `
                <div class="model-result">
                    <div class="model-name">🤖 Naive Bayes</div>
                    <div style="color: ${nbPhishing ? '#c92a2a' : '#2b8a3e'}; font-weight: 600; margin-bottom: 10px;">
                        Prediction: ${data.nb_prediction}
                    </div>
                    <div class="probability-bars">
                        <div class="probability-bar">
                            <label>Safe: ${(data.nb_safe_prob * 100).toFixed(2)}%</label>
                            <div class="bar">
                                <div class="bar-fill" style="width: ${data.nb_safe_prob * 100}%; background: linear-gradient(90deg, #51cf66 0%, #37b24d 100%);">
                                    ${data.nb_safe_prob > 0.1 ? (data.nb_safe_prob * 100).toFixed(0) + '%' : ''}
                                </div>
                            </div>
                        </div>
                        <div class="probability-bar">
                            <label>Phishing: ${(data.nb_phishing_prob * 100).toFixed(2)}%</label>
                            <div class="bar">
                                <div class="bar-fill" style="width: ${data.nb_phishing_prob * 100}%; background: linear-gradient(90deg, #ff6b6b 0%, #c92a2a 100%);">
                                    ${data.nb_phishing_prob > 0.1 ? (data.nb_phishing_prob * 100).toFixed(0) + '%' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="model-result">
                    <div class="model-name">🌲 Random Forest</div>
                    <div style="color: ${rfPhishing ? '#c92a2a' : '#2b8a3e'}; font-weight: 600; margin-bottom: 10px;">
                        Prediction: ${data.rf_prediction}
                    </div>
                    <div class="probability-bars">
                        <div class="probability-bar">
                            <label>Safe: ${(data.rf_safe_prob * 100).toFixed(2)}%</label>
                            <div class="bar">
                                <div class="bar-fill" style="width: ${data.rf_safe_prob * 100}%; background: linear-gradient(90deg, #51cf66 0%, #37b24d 100%);">
                                    ${data.rf_safe_prob > 0.1 ? (data.rf_safe_prob * 100).toFixed(0) + '%' : ''}
                                </div>
                            </div>
                        </div>
                        <div class="probability-bar">
                            <label>Phishing: ${(data.rf_phishing_prob * 100).toFixed(2)}%</label>
                            <div class="bar">
                                <div class="bar-fill" style="width: ${data.rf_phishing_prob * 100}%; background: linear-gradient(90deg, #ff6b6b 0%, #c92a2a 100%);">
                                    ${data.rf_phishing_prob > 0.1 ? (data.rf_phishing_prob * 100).toFixed(0) + '%' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('modelResults').innerHTML = modelResultsHtml;
        }
        
        // Load stats on page load
        window.addEventListener('load', loadStats);
        
        // Allow Enter key to analyze
        document.getElementById('emailInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && event.ctrlKey) {
                analyzeEmail();
            }
        });
    </script>
</body>
</html>
