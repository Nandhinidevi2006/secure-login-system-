<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .auth-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: #666;
            font-size: 0.95em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .auth-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-link a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.error {
            background: #ffe0e0;
            color: #c92a2a;
            border: 2px solid #ff6b6b;
            display: block;
        }
        
        .message.success {
            background: #e0ffe0;
            color: #2b8a3e;
            border: 2px solid #51cf66;
            display: block;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .two-fa-form {
            display: none;
        }
        
        .two-fa-form.show {
            display: block;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🔐 Login</h1>
            <p>Secure Access</p>
        </div>
        
        <div class="message" id="message"></div>
        
        <!-- Login Form -->
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="submit-btn">Login</button>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Logging in...</p>
            </div>
        </form>
        
        <!-- 2FA Form -->
        <div class="two-fa-form" id="twoFAForm">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('totp')">2FA Code</button>
                <button class="tab-btn" onclick="switchTab('backup')">Backup Code</button>
            </div>
            
            <div id="totpTab" class="tab-content">
                <div class="form-group">
                    <label for="totpToken">Enter 6-digit Code</label>
                    <input type="text" id="totpToken" maxlength="6" placeholder="000000" autocomplete="off">
                </div>
                <button type="button" class="submit-btn" onclick="verify2FA('totp')">Verify 2FA</button>
            </div>
            
            <div id="backupTab" class="tab-content" style="display: none;">
                <div class="form-group">
                    <label for="backupCode">Enter Backup Code</label>
                    <input type="text" id="backupCode" placeholder="Enter backup code" autocomplete="off">
                </div>
                <button type="button" class="submit-btn" onclick="verify2FA('backup')">Verify Code</button>
            </div>
            
            <div class="loading" id="loading2fa">
                <div class="spinner"></div>
                <p>Verifying...</p>
            </div>
        </div>
        
        <div class="auth-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>
    
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if (tab === 'totp') {
                document.getElementById('totpTab').style.display = 'block';
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('backupTab').style.display = 'block';
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const messageDiv = document.getElementById('message');
            const loading = document.getElementById('loading');
            
            loading.style.display = 'block';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                loading.style.display = 'none';
                messageDiv.style.display = 'block';
                
                if (data.success) {
                    if (data.requires_2fa) {
                        messageDiv.className = 'message success';
                        messageDiv.textContent = 'Enter your 2FA code';
                        document.getElementById('loginForm').style.display = 'none';
                        document.getElementById('twoFAForm').classList.add('show');
                    } else {
                        messageDiv.className = 'message success';
                        messageDiv.textContent = 'Login successful!';
                        setTimeout(() => {
                            window.location.href = data.redirect;
                        }, 1000);
                    }
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.message;
                }
            } catch (error) {
                loading.style.display = 'none';
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Login failed. Please try again.';
            }
        });
        
        async function verify2FA(type) {
            const token = type === 'totp' 
                ? document.getElementById('totpToken').value 
                : document.getElementById('backupCode').value;
            
            if (!token) {
                alert('Please enter a code');
                return;
            }
            
            const messageDiv = document.getElementById('message');
            const loading = document.getElementById('loading2fa');
            
            loading.style.display = 'block';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch('/verify-2fa', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        use_backup: type === 'backup'
                    })
                });
                
                const data = await response.json();
                loading.style.display = 'none';
                messageDiv.style.display = 'block';
                
                if (data.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = 'Authentication successful!';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.message;
                }
            } catch (error) {
                loading.style.display = 'none';
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Verification failed.';
            }
        }
    </script>
</body>
</html>
